[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "athena-targetome"
version = "0.1.0rc4"
description = "Explicit interaction-model perturbations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Renato Socodato"}]
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.11"]
[project.scripts]
athena-targetome = "athena_targetome.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
